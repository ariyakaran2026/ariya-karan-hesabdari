name: Build ARIYA KARAN Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v5

      - name: نصب Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت نصب‌کننده Windows
        run: npm run build:win

      - name: ذخیره نصب‌کننده
        uses: actions/upload-artifact@v4
        with:
          name: ARIYA-KARAN-Windows
          path: dist/*
